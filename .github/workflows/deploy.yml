name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_and_deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Application
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_ENV: production
          # Firebase configuration
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          # Google Maps configuration
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          # Authentication bypass for testing (set to 'true' to disable auth)
          NEXT_PUBLIC_DISABLE_AUTH: ${{ secrets.NEXT_PUBLIC_DISABLE_AUTH || 'false' }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Setup Firebase Service Account
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > serviceAccountKey.json
          export GOOGLE_APPLICATION_CREDENTIALS=serviceAccountKey.json

      - name: Deploy to Firebase
        run: |
          # Deploy hosting first (doesn't require rules permissions)
          firebase deploy --only hosting

          # Deploy Firestore rules separately
          # Note: If you see "Permission denied to get service [firestore.googleapis.com]",
          # the Firestore API needs to be enabled manually in Google Cloud Console:
          # https://console.cloud.google.com/apis/library/firestore.googleapis.com?project=schools-in-check
          # Or grant the service account "Service Usage Admin" role in IAM.
          firebase deploy --only firestore:rules --non-interactive || {
            echo "⚠️  Firestore rules deployment failed"
            echo "This may be due to:"
            echo "  1. Firestore API not enabled - enable it in GCP Console"
            echo "  2. Service account missing 'Service Usage Admin' role"
            echo "  3. Service account missing 'Firebase Rules Admin' role"
            echo "Deployment will continue, but Firestore rules were not updated."
            exit 0  # Don't fail the build
          }
        env:
          GOOGLE_APPLICATION_CREDENTIALS: serviceAccountKey.json
