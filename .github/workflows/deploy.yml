name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_and_deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Application
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_ENV: production
          # Firebase configuration
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          # Google Maps configuration
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          # Authentication bypass for testing (set to 'true' to disable auth)
          NEXT_PUBLIC_DISABLE_AUTH: ${{ secrets.NEXT_PUBLIC_DISABLE_AUTH || 'false' }}

      - name: Install Firebase CLI and jq
        run: |
          npm install -g firebase-tools
          sudo apt-get update && sudo apt-get install -y jq || true

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          service_account_key: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          project_id: schools-in-check
          export_default_credentials: true

      - name: Setup Firebase Project
        run: |
          firebase use schools-in-check --non-interactive || true
          # Authenticate Firebase CLI using gcloud credentials
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/.config/gcloud/application_default_credentials.json" || true

      - name: Deploy Hosting
        run: firebase deploy --only hosting --non-interactive

      - name: Deploy Firestore Rules
        run: |
          # Try deploying with Firebase CLI first
          if firebase deploy --only firestore:rules --non-interactive 2>&1 | tee /tmp/firestore-deploy.log; then
            echo "✅ Firestore rules deployed successfully via Firebase CLI"
          else
            DEPLOY_ERROR=$(cat /tmp/firestore-deploy.log)
            
            # Check if error is about API enablement check
            if echo "$DEPLOY_ERROR" | grep -q "Permission denied to get service"; then
              echo "⚠️  Firebase CLI cannot verify API status, trying alternative method..."
              
              # Use gcloud to deploy rules via REST API
              PROJECT_ID="schools-in-check"
              RULES_FILE="firestore.rules"
              
              if [ ! -f "$RULES_FILE" ]; then
                echo "Error: Rules file not found: $RULES_FILE"
                exit 0
              fi
              
              # Get access token
              ACCESS_TOKEN=$(gcloud auth print-access-token)
              
              # Read and escape rules content
              RULES_CONTENT=$(cat "$RULES_FILE" | jq -Rs .)
              
              echo "Creating ruleset via REST API..."
              
              # Create ruleset
              RULESET_RESPONSE=$(curl -s -X POST \
                -H "Authorization: Bearer $ACCESS_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{
                  \"source\": {
                    \"files\": [{
                      \"name\": \"firestore.rules\",
                      \"content\": $RULES_CONTENT
                    }]
                  }
                }" \
                "https://firebaserules.googleapis.com/v1/projects/$PROJECT_ID/rulesets")
              
              RULESET_NAME=$(echo "$RULESET_RESPONSE" | jq -r '.name // empty')
              
              if [ -z "$RULESET_NAME" ] || [ "$RULESET_NAME" == "null" ]; then
                echo "⚠️  Failed to create ruleset via REST API:"
                echo "$RULESET_RESPONSE" | jq '.' || echo "$RULESET_RESPONSE"
                echo "Deployment will continue - hosting is deployed successfully."
                exit 0
              fi
              
              echo "Ruleset created: $RULESET_NAME"
              
              # Release the ruleset
              RELEASE_RESPONSE=$(curl -s -X POST \
                -H "Authorization: Bearer $ACCESS_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{
                  \"rulesetName\": \"$RULESET_NAME\",
                  \"release\": {
                    \"name\": \"projects/$PROJECT_ID/releases/cloud.firestore\"
                  }
                }" \
                "https://firebaserules.googleapis.com/v1/projects/$PROJECT_ID/releases")
              
              if echo "$RELEASE_RESPONSE" | jq -e '.error' > /dev/null 2>&1; then
                echo "⚠️  Failed to release ruleset:"
                echo "$RELEASE_RESPONSE" | jq '.' || echo "$RELEASE_RESPONSE"
                echo "Deployment will continue - hosting is deployed successfully."
                exit 0
              fi
              
              echo "✅ Firestore rules deployed successfully via REST API!"
            else
              echo "⚠️  Firestore rules deployment failed with error:"
              echo "$DEPLOY_ERROR"
              echo "Deployment will continue - hosting is deployed successfully."
              exit 0
            fi
          fi
